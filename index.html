function openM(x){$(x).classList.add('open')}function closeM(x){$(x).classList.remove('open')}async function save(t,o){let{error}=await db.from(t).upsert(o);if(error){alert(error.message);return false}await load();return true}async function load(){
 $('sync').textContent='Łączenie z serwerem…';
 const timeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error('Przekroczono czas połączenia z serwerem')),12000));
 try{
  const request=Promise.all([
   db.from('strapex_machines').select('*').order('name'),

   db.from('app_state').select('payload').eq('id',6).maybeSingle(),
   db.from('strapex_repairs').select('*').order('opened_at',{ascending:false}),
   db.from('strapex_repair_entries').select('*').order('entry_date',{ascending:false}),db.from('app_state').select('payload').eq('id',9).maybeSingle()
  ]);
  const q=await Promise.race([request,timeout]);
  const failed=q.find(x=>x.error);if(failed)throw failed.error;
  M=q[0].data||[];S=q[1].data||[];

  const categories=Array.isArray(shared.categories)?shared.categories:[];const strapexIds=new Set(categories.filter(c=>String(c.name||'').trim().toLowerCase()==='strapex').map(c=>String(c.id)));P=(Array.isArray(shared.items)?shared.items:[]).filter(p=>{const category=String(p.category??p.category_id??'').trim();return category.toLowerCase()==='strapex'||strapexIds.has(category)}).map(p=>({...p,quantity:Number(p.qty??p.quantity??0),part_number:p.number??p.part_number??''}));
  R=q[3].data||[];RE=q[4].data||[];H=Array.isArray(q[5].data?.payload?.items)?q[5].data.payload.items:[];
  $('sync').textContent='Połączono · Maszyny i części zsynchronizowane';render();
 }catch(e){$('sync').textContent='Błąd połączenia: '+e.message;console.error('Strapex load error',e);render()}
}
function daysSince(d){if(!d)return 0;return Math.max(0,Math.floor((new Date(today())-new Date(d))/86400000))}function person(){return profile?.full_name||profile?.email||user?.email||'-'}function statusLabel(x){return tr('status'+({production:'Production',ready:'Ready',repair:'Repair',service:'Service',waiting:'Waiting',parts:'Parts',offline:'Offline'}[x]||'Offline'))}
function render(){const cards=M.map(m=>{const prodDays=m.status==='production'?daysSince(m.status_since):0,last=S.find(x=>x.machine_id===m.id),alert=m.status==='production'&&prodDays>28;return `<button class="machineDash card ${alert?'alert':''}" onclick="details('${m.id}')"><div class="row"><span class="machineName">${esc(m.name)}</span><span class="badge ${m.status}">${esc(statusLabel(m.status))}</span></div><div class="machineMeta"><div><span class="mut">${tr('lastService')}</span><br><b>${esc(last?.service_date||m.last_service||tr('none'))}</b></div><div><span class="mut">${tr('productionTime')}</span><br><b>${prodDays} ${tr('days')}</b></div><div><span class="mut">${tr('straps')}</span><br><b>${Number(m.straps||0).toLocaleString()}</b></div><div><span class="mut">${tr('lastOperator')}</span><br><b>${esc(last?.performed_by||tr('none'))}</b></div></div>${alert?`<div class="serviceAlert">⚠ ${tr('serviceDue')}</div>`:''}</button>`}).join('');$('dashMachines').innerHTML=cards||`<div class="empty">${tr('noMachines')}</div>`;$('machineList').innerHTML=M.map(m=>`<div class="item" onclick="details('${m.id}')"><div class="row"><b>${esc(m.name)}</b><span class="badge ${m.status}">${esc(statusLabel(m.status))}</span></div><div class="mut">${esc(m.serial_number||'')} · ${Number(m.straps||0).toLocaleString()} ${tr('strapUnits')}</div></div>`).join('')||`<div class="empty">${tr('noMachines')}</div>`;$('sMachine').innerHTML=$('rMachine').innerHTML=M.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');$('swapOld').innerHTML=M.filter(m=>m.status==='production').map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');$('swapNew').innerHTML=M.filter(m=>m.status!=='production').map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');$('partList').innerHTML=P.map(p=>`<div class="item"><div class="row"><b>${esc(p.name)}</b><span>${p.quantity}</span></div><div class="mut">${esc(p.part_number||'')}</div></div>`).join('')||`<div class="empty">${tr('noParts')}</div>`;$('serviceList').innerHTML=S.map(x=>`<div class="item"><b>${esc(M.find(m=>m.id===x.machine_id)?.name||'')} · ${esc(x.service_type)}</b><div>${esc(x.work_done)}</div><div class="mut">${esc(x.service_date)} · ${tr('performedBy')}: ${esc(x.performed_by||'-')} · ${esc(x.parts_changed||'')}</div></div>`).join('')||`<div class="empty">${tr('noEntries')}</div>`;const open=R.filter(x=>x.status==='open');$('repairList').innerHTML=open.map(r=>`<div class="item" onclick="repairDetails('${r.id}')"><b>${esc(M.find(m=>m.id===r.machine_id)?.name||'')}</b><div>${esc(r.summary)}</div><div class="mut">${esc(r.opened_at)} · ${tr('openedBy')}: ${esc(r.opened_by||'-')}</div></div>`).join('')||`<div class="empty">${tr('noOpenRepairs')}</div>`}
function editMachine(id=''){let m=M.find(x=>x.id===id)||{};$('mId').value=m.id||'';$('mName').value=m.name||'';$('mSerial').value=m.serial_number||'';$('mStatus').value=m.status||'production';$('mStraps').value=m.straps||0;$('deleteMachineBtn').classList.toggle('hidden',!m.id);openM('machineModal')}function details(id){const m=M.find(x=>x.id===id),logs=S.filter(x=>x.machine_id===id),reps=R.filter(x=>x.machine_id===id),history=[...H.filter(x=>x.machine_id===id||x.old_machine_id===id||x.new_machine_id===id),...logs.map(x=>({type:'service',date:x.service_date,text:`${tr('service')} ${x.service_type}: ${x.work_done}`,by:x.performed_by})),...reps.map(x=>({type:'repair',date:x.opened_at,text:x.summary,by:x.opened_by}))].sort((a,b)=>String(b.date||b.created_at).localeCompare(String(a.date||a.created_at)));$('detailTitle').textContent=m.name;$('detailBody').innerHTML=`<div class="panel"><div class="row"><b>${tr('status')}: ${esc(statusLabel(m.status))}</b><span>${Number(m.straps||0).toLocaleString()} ${tr('strapUnits')}</span></div><div class="mut">${tr('productionTime')}: ${m.status==='production'?daysSince(m.status_since):0} ${tr('days')}</div></div><h3>${tr('timeline')}</h3><div class="timeline">${history.map(x=>`<div class="timelineItem ${x.type==='swap'?'swap':x.type==='service'?'serviceEvent':'repairEvent'}"><b>${esc(x.date||x.created_at||'')} · ${esc(tr(x.type)||x.type)}</b><div>${esc(x.text||x.reason||'')}</div><div class="mut">${tr('performedBy')}: ${esc(x.by||x.changed_by||'-')}</div></div>`).join('')||`<div class="empty">${tr('none')}</div>`}</div>`;$('detailEdit').onclick=()=>{closeM('detailModal');editMachine(id)};$('detailDelete').onclick=()=>deleteMachine(id);$('detailService').onclick=()=>{closeM('detailModal');openService(id)};$('detailRepair').onclick=()=>{closeM('detailModal');openRepair(id)};openM('detailModal')}
async function deleteMachine(givenId=''){
 const id=givenId||$('mId').value,m=M.find(x=>x.id===id);if(!id)return;
 if(!confirm(`Usunąć maszynę ${m?.name||''} wraz z całą historią serwisów i napraw?`))return;
 $('sync').textContent='Usuwanie maszyny…';
 try{
  const rr=await db.from('strapex_repairs').select('id').eq('machine_id',id);if(rr.error)throw rr.error;
  const repairIds=(rr.data||[]).map(x=>x.id);
  if(repairIds.length){const a=await db.from('strapex_repair_entries').delete().in('repair_id',repairIds).select('id');if(a.error)throw a.error}
  const b=await db.from('strapex_service_logs').delete().eq('machine_id',id).select('id');if(b.error)throw b.error;
  const c=await db.from('strapex_repairs').delete().eq('machine_id',id).select('id');if(c.error)throw c.error;
  const d=await db.from('strapex_machines').delete().eq('id',id).select('id');if(d.error)throw d.error;
  if(!d.data?.length)throw new Error('Serwer nie usunął rekordu. Sprawdź politykę DELETE dla strapex_machines.');
  closeM('machineModal');closeM('detailModal');await load();
  alert('Maszyna została usunięta.');
 }catch(e){$('sync').textContent='Błąd usuwania: '+e.message;alert('Nie można usunąć maszyny: '+e.message)}
}
function picker(id){$(id).innerHTML=P.map(p=>`<div class="partPick"><span>${esc(p.name)} (${p.quantity})</span><input type="number" min="0" max="${p.quantity}" value="0" data-part="${p.id}"></div>`).join('')}function selected(id){return [...$(id).querySelectorAll('[data-part]')].map(x=>({id:x.dataset.part,q:+x.value})).filter(x=>x.q>0)}async function deduct(items){
 if(!items.length)return;
 const row=await db.from('app_state').select('payload').eq('id',6).maybeSingle();if(row.error)throw row.error;
 const payload=row.data?.payload||{},all=Array.isArray(payload.items)?payload.items:[];
 for(const x of items){const p=all.find(y=>String(y.id)===String(x.id)),qty=Number(p?.qty??p?.quantity??0);if(!p||x.q>qty)throw Error('Brak części: '+(p?.name||x.id));p.qty=qty-x.q;if('quantity' in p)p.quantity=p.qty;p.updated_at=new Date().toISOString()}
 payload.items=all;payload.updated_at=new Date().toISOString();
