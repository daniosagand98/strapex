<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strapex Control</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>

ttom));z-index:20}nav button{background:none;border:0;color:var(--mut);font-size:10px}nav b{display:block;font-size:19px}nav .on{color:#60a5fa}.view{display:none}.view.on{display:block}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:50;padding:calc(15px + env(safe-area-inset-top)) 12px;overflow:auto}.modal.open{display:flex}.sheet{width:min(680px,100%);margin:auto;background:#0d1d31;border:1px solid var(--line);border-radius:22px;padding:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:12px;color:#cbd5e1}.form input,.form select,.form textarea{display:block;width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#07111f;color:#fff}.wide{grid-column:1/-1}.actions{justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.partsPick{display:grid;gap:7px;margin-top:6px}.partPick{display:grid;grid-template-columns:1fr 80px;gap:8px;align-items:center}.empty{text-align:center;color:var(--mut);padding:25px}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.machines,.form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><header><button id="home" class="icon" type="button" aria-label="Powrót do Lobby" title="Powrót do Lobby">🏠</button><h1>🔧 Strapex Control</h1><button id="refresh" class="icon" type="button" title="Odśwież">↻</button></header><main class="wrap"><div id="sync" class="mut" style="text-align:center;margin-bottom:10px">Łączenie…</div><section id="dash" class="view on"><div class="grid"><div class="card"><div id="nProd" class="num">0</div><div class="mut">Na produkcji</div></div><div class="card"><div id="nRep" class="num">0</div><div class="mut">W naprawie</div></div><div class="card"><div id="nReady" class="num">0</div><div class="mut">Gotowe</div></div><div class="card"><div id="nOpen" class="num">0</div><div class="mut">Otwarte naprawy</div></div></div></section><section id="machines" class="view"><div class="panel"><div class="head"><h2>Maszyny</h2><button class="btn" onclick="editMachine()">+ Dodaj</button></div><div id="machineList" class="list machines"></div></div></section><section id="repairs" class="view"><div class="panel"><div class="head"><h2>Otwarte naprawy</h2><button class="btn" onclick="openRepair()">+ Nowa</button></div><div id="repairList" class="list"></div></div></section><section id="services" class="view"><div class="panel"><div class="head"><h2>Serwisy</h2><button class="btn" onclick="openService()">+ Wpis</button></div><div id="serviceList" class="list"></div></div></section><section id="parts" class="view"><div class="panel"><h2>Części</h2><div id="partList" class="list"></div></div></section></main><nav><button class="on" data-page="dash"><b>⌂</b>Start</button><button data-page="machines"><b>▣</b>Maszyny</button><button data-page="repairs"><b>🛠</b>Naprawy</button><button data-page="services"><b>⌁</b>Serwisy</button><button data-page="parts"><b>⚙</b>Części</button></nav>
<div id="machineModal" class="modal"><div class="sheet"><h2>Maszyna</h2><form id="machineForm"><input id="mId" type="hidden"><div class="form"><label>Nazwa<input id="mName" required></label><label>Numer seryjny<input id="mSerial"></label><label>Status<select id="mStatus"><option value="production">Na produkcji</option><option value="ready">Gotowa</option><option value="repair">W naprawie</option><option value="service">W serwisie</option><option value="waiting">Oczekuje na serwis</option><option value="parts">Oczekuje na części</option><option value="offline">Wyłączona</option></select></label><label>Licznik strapów<input id="mStraps" type="number" min="0"></label></div><div class="actions"><button type="button" id="deleteMachineBtn" class="btn red hidden" onclick="deleteMachine()">Usuń maszynę</button><button type="button" class="btn alt" onclick="closeM('machineModal')">Anuluj</button><button class="btn">Zapisz</button></div></form></div></div>

<div id="repairModal" class="modal"><div class="sheet"><h2>Naprawa</h2><form id="repairForm"><input id="rId" type="hidden"><div class="form"><label>Maszyna<select id="rMachine"></select></label><label>Data<input id="rDate" type="date" required></label><label class="wide">Wykonane prace / opis<textarea id="rText" required></textarea></label><label class="wide">Zużyte części<div id="repairParts" class="partsPick"></div></label></div><div class="actions"><button type="button" class="btn alt" onclick="closeM('repairModal')">Anuluj</button><button class="btn">Zapisz</button></div></form></div></div>

<script>'use strict';const SUPABASE_URL='https://xgcowpifwmihuukjinuf.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_OvfeU9VHpQt-A8e8MX_ZQQ_tfMpQ3N_';const LOBBY='https://daniosagand98.github.io/VedlikeholdVikingFjord/';let db=null;const $=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10),uid=()=>crypto.randomUUID(),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let M=[],S=[],P=[],R=[],RE=[],user;
function openM(x){$(x).classList.add('open')}function closeM(x){$(x).classList.remove('open')}async function save(t,o){let{error}=await db.from(t).upsert(o);if(error){alert(error.message);return false}return true}async function load(){
 $('sync').textContent='Łączenie z serwerem…';
 const timeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error('Przekroczono czas połączenia z serwerem')),12000));
 try{
  const request=Promise.all([
   db.from('strapex_machines').select('*').order('name'),
   db.from('strapex_service_logs').select('*').order('service_date',{ascending:false}),
   db.from('app_state').select('payload').eq('id',6).maybeSingle(),
   db.from('strapex_repairs').select('*').order('opened_at',{ascending:false}),
   db.from('strapex_repair_entries').select('*').order('entry_date',{ascending:false})
  ]);
  const q=await Promise.race([request,timeout]);
  const failed=q.find(x=>x.error);if(failed)throw failed.error;
  M=q[0].data||[];S=q[1].data||[];
  const shared=q[2].data?.payload||{};
  P=(Array.isArray(shared.items)?shared.items:[]).map(p=>({...p,quantity:Number(p.qty??p.quantity??0),part_number:p.number??p.part_number??''}));
  R=q[3].data||[];RE=q[4].data||[];
  $('sync').textContent='Połączono · Maszyny i części zsynchronizowane';render();
 }catch(e){$('sync').textContent='Błąd połączenia: '+e.message;console.error('Strapex load error',e);render()}
}
function render(){$('nProd').textContent=M.filter(x=>x.status==='production').length;$('nRep').textContent=M.filter(x=>x.status==='repair').length;$('nReady').textContent=M.filter(x=>x.status==='ready').length;$('nOpen').textContent=R.filter(x=>x.status==='open').length;$('machineList').innerHTML=M.map(m=>`<div class="item" onclick="details('${m.id}')"><div class="row"><b>${esc(m.name)}</b><span class="badge ${m.status}">${m.status}</span></div><div class="mut">${esc(m.serial_number||'')} · ${(m.straps||0).toLocaleString()} strapów</div></div>`).join('')||'<div class="empty">Brak maszyn</div>';$('sMachine').innerHTML=$('rMachine').innerHTML=M.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('');$('partList').innerHTML=P.map(p=>`<div class="item"><div class="row"><b>${esc(p.name)}</b><span>${p.quantity}</span></div><div class="mut">${esc(p.part_number||'')}</div></div>`).join('')||'<div class="empty">Brak części</div>';$('serviceList').innerHTML=S.map(s=>`<div class="item"><b>${esc(M.find(m=>m.id===s.machine_id)?.name||'')} · ${esc(s.service_type)}</b><div>${esc(s.work_done)}</div><div class="mut">${esc(s.service_date)} · ${esc(s.parts_changed||'')}</div></div>`).join('')||'<div class="empty">Brak wpisów</div>';let open=R.filter(x=>x.status==='open');$('repairList').innerHTML=open.map(r=>`<div class="item" onclick="repairDetails('${r.id}')"><b>${esc(M.find(m=>m.id===r.machine_id)?.name||'')}</b><div>${esc(r.summary)}</div><div class="mut">${esc(r.opened_at)}</div></div>`).join('')||'<div class="empty">Brak otwartych napraw</div>'}
function editMachine(id=''){let m=M.find(x=>x.id===id)||{};$('mId').value=m.id||'';$('mName').value=m.name||'';$('mSerial').value=m.serial_number||'';$('mStatus').value=m.status||'production';$('mStraps').value=m.straps||0;$('deleteMachineBtn').classList.toggle('hidden',!m.id);openM('machineModal')}function details(id){let m=M.find(x=>x.id===id),logs=S.filter(x=>x.machine_id===id),reps=R.filter(x=>x.machine_id===id);$('detailTitle').textContent=m.name;$('detailBody').innerHTML=`<div class="panel"><b>Status: ${esc(m.status)}</b><div>${(m.straps||0).toLocaleString()} strapów</div></div><h3>Historia serwisów</h3>${logs.map(x=>`<div class="item"><b>${esc(x.service_date)} · ${esc(x.service_type)}</b><div>${esc(x.work_done)}</div></div>`).join('')||'<div class="empty">Brak</div>'}<h3>Naprawy</h3>${reps.map(x=>`<div class="item"><b>${esc(x.opened_at)} · ${esc(x.status)}</b><div>${esc(x.summary)}</div></div>`).join('')||'<div class="empty">Brak</div>'}`;$('detailEdit').onclick=()=>{closeM('detailModal');editMachine(id)};$('detailDelete').onclick=()=>deleteMachine(id);$('detailService').onclick=()=>{closeM('detailModal');openService(id)};$('detailRepair').onclick=()=>{closeM('detailModal');openRepair(id)};openM('detailModal')}
async function deleteMachine(givenId=''){
 const id=givenId||$('mId').value,m=M.find(x=>x.id===id);if(!id)return;
 if(!confirm(`Usunąć maszynę ${m?.name||''} wraz z całą historią serwisów i napraw?`))return;
 $('sync').textContent='Usuwanie maszyny…';
 try{
  const rr=await db.from('strapex_repairs').select('id').eq('machine_id',id);if(rr.error)throw rr.error;
  const repairIds=(rr.data||[]).map(x=>x.id);
  if(repairIds.length){const a=await db.from('strapex_repair_entries').delete().in('repair_id',repairIds).select('id');if(a.error)throw a.error}
  const b=await db.from('strapex_service_logs').delete().eq('machine_id',id).select('id');if(b.error)throw b.error;
  const c=await db.from('strapex_repairs').delete().eq('machine_id',id).select('id');if(c.error)throw c.error;
  const d=await db.from('strapex_machines').delete().eq('id',id).select('id');if(d.error)throw d.error;
  if(!d.data?.length)throw new Error('Serwer nie usunął rekordu. Sprawdź politykę DELETE dla strapex_machines.');
  closeM('machineModal');closeM('detailModal');await load();
  alert('Maszyna została usunięta.');
 }catch(e){$('sync').textContent='Błąd usuwania: '+e.message;alert('Nie można usunąć maszyny: '+e.message)}
}
function picker(id){$(id).innerHTML=P.map(p=>`<div class="partPick"><span>${esc(p.name)} (${p.quantity})</span><input type="number" min="0" max="${p.quantity}" value="0" data-part="${p.id}"></div>`).join('')}function selected(id){return [...$(id).querySelectorAll('[data-part]')].map(x=>({id:x.dataset.part,q:+x.value})).filter(x=>x.q>0)}async function deduct(items){
 if(!items.length)return;
 const row=await db.from('app_state').select('payload').eq('id',6).maybeSingle();if(row.error)throw row.error;
 const payload=row.data?.payload||{},all=Array.isArray(payload.items)?payload.items:[];
 for(const x of items){const p=all.find(y=>String(y.id)===String(x.id)),qty=Number(p?.qty??p?.quantity??0);if(!p||x.q>qty)throw Error('Brak części: '+(p?.name||x.id));p.qty=qty-x.q;if('quantity' in p)p.quantity=p.qty;p.updated_at=new Date().toISOString()}
 payload.items=all;payload.updated_at=new Date().toISOString();
 const saved=await db.from('app_state').upsert({id:6,payload},{onConflict:'id'}).select('id');if(saved.error)throw saved.error;
}

$('machineForm').onsubmit=async e=>{e.preventDefault();let old=M.find(x=>x.id===$('mId').value),o={id:$('mId').value||uid(),name:$('mName').value,serial_number:$('mSerial').value,status:$('mStatus').value,straps:+$('mStraps').value,last_service:old?.last_service||null,last_service_type:old?.last_service_type||'A',last_service_straps:old?.last_service_straps||0,status_since:old?.status===$('mStatus').value?old.status_since:today(),updated_at:new Date().toISOString()};if(await save('strapex_machines',o)){closeM('machineModal');load()}};$('serviceForm').onsubmit=async e=>{e.preventDefault();let it=selected('serviceParts');try{await deduct(it);let desc=it.map(x=>`${P.find(p=>p.id===x.id).name} x${x.q}`).join(', '),o={id:uid(),machine_id:$('sMachine').value,service_type:$('sType').value,service_date:$('sDate').value,straps:+$('sStraps').value,performed_by:user.email,parts_changed:desc,work_done:$('sWork').value,created_at:new Date().toISOString()};if(await save('strapex_service_logs',o)){await db.from('strapex_machines').update({straps:o.straps,last_service:o.service_date,last_service_type:o.service_type,last_service_straps:o.straps}).eq('id',o.machine_id);closeM('serviceModal');load()}}catch(x){alert(x.message)}};$('repairForm').onsubmit=async e=>{e.preventDefault();let it=selected('repairParts');try{await deduct(it);let desc=it.map(x=>`${P.find(p=>p.id===x.id).name} x${x.q}`).join(', '),rid=$('rId').value;if(rid)await save('strapex_repair_entries',{id:uid(),repair_id:rid,entry_date:$('rDate').value,note:$('rText').value,parts_used:desc,created_by:user.email});else{rid=uid();await save('strapex_repairs',{id:rid,machine_id:$('rMachine').value,opened_at:$('rDate').value,status:'open',summary:$('rText').value,opened_by:user.email});await db.from('strapex_machines').update({status:'repair',status_since:today()}).eq('id',$('rMachine').value)}closeM('repairModal');load()}catch(x){alert(x.message)}};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view,nav button').forEach(x=>x.classList.remove('on'));$(b.dataset.page).classList.add('on');b.classList.add('on')});$('home').addEventListener('click',()=>{if(window.self!==window.top){window.parent.postMessage({type:'vf-open-lobby'},'*');return}window.location.href=LOBBY});$('refresh').addEventListener('click',()=>{if(db)load()});(async()=>{try{const cleanUrl=String(SUPABASE_URL).trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(cleanUrl))throw new Error('Nieprawidłowy adres Supabase: '+cleanUrl);db=window.supabase.createClient(cleanUrl,String(SUPABASE_ANON_KEY).trim(),{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{session},error:sessionError}=await db.auth.getSession();if(sessionError)throw sessionError;if(!session){window.top===window?window.location.assign(LOBBY):window.parent.postMessage({type:'vf-open-lobby'},'*');return}user=session.user;await load();db.channel('strapex-live-v12').on('postgres_changes',{event:'*',schema:'public',table:'app_state',filter:'id=eq.6'},load).on('postgres_changes',{event:'*',schema:'public',table:'strapex_machines'},load).on('postgres_changes',{event:'*',schema:'public',table:'strapex_repairs'},load).on('postgres_changes',{event:'*',schema:'public',table:'strapex_service_logs'},load).on('postgres_changes',{event:'*',schema:'public',table:'strapex_repair_entries'},load).subscribe(status=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')$('sync').textContent='Połączono · Odświeżanie automatyczne niedostępne'});}catch(e){$('sync').textContent='Błąd uruchomienia: '+e.message;console.error('Strapex init error',e)}})();</script></body></html>
